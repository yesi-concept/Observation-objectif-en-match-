<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches Poste — Y.E.S.I CONCEPT</title>
<style>
:root{--bg:#0f1218;--card:#181d26;--line:#2a3140;--gold:#d4af37;--gold2:#f0d77a;--beige:#efe6d2;--txt:#e9e4d8;--mut:#9aa1ad;--ok:#3fbf7f;--mid:#e3a63b;--ko:#e05757;--blue:#2f6fd6;--wa:#25a35a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;padding:16px;max-width:760px;margin:auto}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:16px}
header svg{flex:0 0 58px}
header h1{font-size:18px;color:var(--gold);letter-spacing:.5px}
header p{font-size:12px;color:var(--mut)}
h2{font-size:16px;color:var(--gold);margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}
h3{font-size:15px;color:var(--beige);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,textarea,select{width:100%;background:#0f1218;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-size:15px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
.hint{font-size:12px;color:var(--mut);margin:4px 0 10px}
.q{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.q b{color:var(--beige);font-size:14px}
.q small{display:block;color:var(--mut);font-size:12.5px}
.star{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mut);font-size:17px;cursor:pointer}
.star.on{background:var(--gold);color:#111;border-color:var(--gold)}
.badge{display:inline-block;background:var(--gold);color:#111;font-weight:700;font-size:12px;border-radius:20px;padding:2px 10px;margin-right:6px}
.obj{border-left:4px solid var(--gold)}
.cible{font-size:13px;color:var(--gold2);margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
th{color:var(--mut);font-weight:500;font-size:12px}
td:first-child,th:first-child{text-align:left}
.cnt{display:inline-flex;align-items:center;gap:6px}
.cnt button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#0f1218;color:var(--txt);font-size:17px;cursor:pointer}
.cnt span{min-width:20px;font-weight:700}
.tgt{width:46px!important;padding:4px!important;text-align:center}
.res{font-weight:700;font-size:15px;padding:8px 10px;border-radius:8px;text-align:center;margin-top:8px;background:#0f1218}
.ok{color:var(--ok)}.mid{color:var(--mid)}.ko{color:var(--ko)}
ul.cons{padding-left:18px;font-size:13.5px;color:var(--beige)}
ul.cons li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:#0f1218;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:3px 10px;font-size:12.5px}
.rate{display:flex;gap:4px;justify-content:center}
.rate button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#0f1218;color:var(--mut);font-size:12px;cursor:pointer}
.rate button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.score{font-size:28px;text-align:center;color:var(--gold);font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 30px}
.btn{padding:13px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;text-align:center;display:block}
.b1{background:var(--gold);color:#111}.b2{background:var(--blue);color:#fff}.b3{background:#262c38;color:var(--txt)}.bwa{background:var(--wa);color:#fff}
.full{grid-column:1/-1}
.back{background:none;border:1px solid var(--line);color:var(--gold2);border-radius:20px;padding:6px 14px;font-size:13px;margin-bottom:12px;cursor:pointer}
.postes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.poste{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.poste b{display:block;color:var(--beige);font-size:14px;margin-bottom:8px}
.poste .ab{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.poste button{padding:8px 4px;border-radius:8px;border:none;font-size:12.5px;font-weight:700;cursor:pointer}
.steps{padding-left:18px;font-size:13.5px}
.steps li{margin:4px 0}
.link{word-break:break-all;font-size:12px;color:var(--gold2);background:#0f1218;border-radius:8px;padding:8px;margin:8px 0;display:none}
.hbar{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.hcol{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mut)}
.hcol div{width:22px;border-radius:5px 5px 0 0}
.hcol span{margin-top:3px}
.mnum{display:inline-block;background:var(--blue);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
footer{text-align:center;font-size:11px;color:var(--mut);padding-bottom:20px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
@media print{
 body{background:#fff;color:#111;max-width:none;padding:8mm}
 .card{background:#fff;border-color:#ccc;break-inside:avoid}
 input,textarea,select{background:#fff;color:#111;border-color:#bbb}
 h2,header h1{color:#8a6d12}.q b,h3,ul.cons{color:#111}.btns,.back,.noprint{display:none!important}
 .res{background:#f4f1e8}.cnt button,.rate button:not(.on){display:none}
 .star:not(.on){opacity:.3}
}
</style>
</head>

/* ================= ROUTAGE ================= */
const U=new URLSearchParams(location.search);
const ID=U.get("poste"),BENEF=U.get("b")==="1",JOUEUR=(U.get("joueur")||"").trim();
const BASE=location.href.split("#")[0].split("?")[0];
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lien=(id,n)=>BASE+"?poste="+id+(n?"&joueur="+encodeURIComponent(n):"")+"&b=1";
const msg=(id,n)=>`Salut${n?" "+n:""} 👋\nVoici ta fiche ${P[id].nom} Y.E.S.I CONCEPT.\nAvant chaque match : choisis tes qualités et lis tes objectifs.\nAprès chaque match : remplis la fiche, appuie sur « Envoyer à Mr Din », puis sur « Nouveau match ».\nGarde ce lien, il te servira à chaque match :\n${lien(id,n)}`;


/* ================= ACCUEIL (Dezz) ================= */
function accueil(){
 app.innerHTML=`
 <div class="card">
 <h3>📤 Envoyer une fiche à un joueur</h3>
 <ol class="steps"><li>Choisis le poste et écris le nom du joueur.</li><li>Envoie le lien par WhatsApp, mail ou copie.</li><li>Le joueur remplit sa fiche <b>après chaque match</b> et te la renvoie. Son historique reste sur son téléphone.</li></ol>
 <div class="grid2" style="margin-top:10px">
 <div><label>Poste</label><select id="gp">${ORDRE.map(i=>`<option value="${i}">${P[i].nom}</option>`).join("")}</select></div>
 <div><label>Nom du joueur</label><input id="gn" placeholder="Prénom Nom"></div>
 </div>
 <div class="link" id="gl"></div>
 <div class="btns" style="margin:10px 0 0">
 <button class="btn bwa" onclick="go('wa')">WhatsApp</button>
 <button class="btn b2" onclick="go('mail')">✉️ Email</button>
 <button class="btn b3" onclick="go('copy')">🔗 Copier le lien</button>
 <button class="btn b1" onclick="go('share')">📲 Partager</button>
 </div>
 </div>
 <h2>Tous les postes</h2>
 <div class="postes">${ORDRE.map(i=>`<div class="poste"><b>${P[i].nom}</b><div class="ab"><button class="b3" onclick="location.href='?poste=${i}'">👁 Voir</button><button class="b1" onclick="pick('${i}')">📤 Envoyer</button></div></div>`).join("")}</div>`;
}
function pick(i){document.getElementById("gp").value=i;window.scrollTo({top:0,behavior:"smooth"});document.getElementById("gn").focus()}
function go(t){
 const id=document.getElementById("gp").value,n=document.getElementById("gn").value.trim(),l=lien(id,n),m=msg(id,n);
 const gl=document.getElementById("gl");gl.style.display="block";gl.textContent=l;
 if(t==="wa")window.open("https://wa.me/?text="+encodeURIComponent(m),"_blank");
 if(t==="mail")location.href="mailto:?subject="+encodeURIComponent("Ta fiche "+P[id].nom+" — Y.E.S.I CONCEPT")+"&body="+encodeURIComponent(m);
 if(t==="copy")copier(l);
 if(t==="share"){if(navigator.share)navigator.share({title:"Fiche "+P[id].nom,text:m}).catch(()=>{});else copier(m)}
}
function copier(x){
 if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>alert("Copié ✅"),()=>prompt("Copie le lien :",x));
 else prompt("Copie le lien :",x);
}

/* ================= FICHE POSTE ================= */
let S,KEY,D,ok=[false,false,false];
function vide(){return{q:[],f:{},m:{},c:{},r:{},hist:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function fiche(id){
 D=P[id];
 document.title=D.nom+" — Y.E.S.I";
 document.getElementById("htitle").textContent=D.nom.toUpperCase()+" — QUALITÉS & OBJECTIFS DE MATCH";
 KEY="yesi_fiche_"+id+"_"+(JOUEUR.toLowerCase()||"x");
 S=vide();try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(vide(),x)}catch(e){}
 if(JOUEUR&&!S.f.joueur)S.f.joueur=JOUEUR;
 if(S.f.final===undefined)S.f.final=D.final;
 D.a2.forEach((a,i)=>{if(S.f["t"+(i+1)]===undefined)S.f["t"+(i+1)]=a[1]});

 const blocs=[...D.blocs,["🧠 Mental (Y.E.S.I)",[["Concentration","Rester connecté 90 minutes, avec ou sans ballon."],["Communication",D.comm],["Gestion de l'erreur","Après une erreur : une respiration, la prochaine action."]]]];
 const li=a=>a.map(x=>`<li>${x}</li>`).join("");
 app.innerHTML=`
 ${BENEF?"":`<button class="back" onclick="location.href=BASE">← Tous les postes</button>`}
 <div class="card">
 <span class="mnum" id="mnum"></span>
 <div class="grid2">
 <div><label>Joueur</label><input data-f="joueur" placeholder="Nom Prénom"></div>
 <div><label>Catégorie / Club</label><input data-f="club" placeholder="U17 National…"></div>
 <div><label>Match (adversaire)</label><input data-m="match" placeholder="vs …"></div>
 <div><label>Date</label><input type="date" data-m="date"></div>
 </div>
 </div>

 <h2>1. Les qualités — ${esc(D.nom)}</h2>
 <p class="hint">Touche ★ sur tes <b>3 qualités les plus fortes</b> (max 3). Elles alimentent ton Objectif 2 et restent d'un match à l'autre.</p>
 ${blocs.map(([t,qs])=>`<div class="card"><h3>${t}</h3>${qs.map(([n,d])=>`<div class="q"><button class="star" data-q="${esc(n)}">★</button><div><b>${n}</b><small>${d}</small></div></div>`).join("")}</div>`).join("")}

 <h2>2. Objectifs du match</h2>
 <div class="card"><label>Objectif final du match</label><textarea data-f="final"></textarea></div>

 <div class="card obj">
 <h3><span class="badge">OBJ 1</span>Gagner 80 % de mes duels</h3>
 <div class="cible">🎯 Cible : 80 % sur le match — minimum 70 % par mi-temps</div>
 ${D.duels?`<p class="hint">${D.duels}</p>`:""}
 <table>
 <tr><th>Duels</th><th>MT1</th><th>MT2</th></tr>
 <tr><td>Gagnés</td><td><div class="cnt" data-c="d1g"></div></td><td><div class="cnt" data-c="d2g"></div></td></tr>
 <tr><td>Perdus</td><td><div class="cnt" data-c="d1p"></div></td><td><div class="cnt" data-c="d2p"></div></td></tr>
 <tr><td>%</td><td id="p1">—</td><td id="p2">—</td></tr>
 </table>
 <div class="res" id="r1">Total : —</div>
 <p class="hint" style="margin-top:10px"><b>Consignes :</b></p><ul class="cons">${li(D.c1)}</ul>
 </div>

 <div class="card obj">
 <h3><span class="badge">OBJ 2</span>Apport offensif sur MES qualités</h3>
 <div class="cible">🎯 J'apporte avec ce que je maîtrise — je ne force pas le reste.</div>
 <label>Mes qualités fortes (partie 1)</label>
 <div class="chips" id="chips"></div>
 <table>
 <tr><th>Action</th><th>Cible</th><th>MT1</th><th>MT2</th></tr>
 ${D.a2.map((a,i)=>`<tr><td>${a[0]}</td><td><input class="tgt" inputmode="numeric" data-f="t${i+1}"></td><td><div class="cnt" data-c="o${i+1}a"></div></td><td><div class="cnt" data-c="o${i+1}b"></div></td></tr>`).join("")}
 </table>
 <div class="res" id="r2">—</div>
 <p class="hint" style="margin-top:10px"><b>Consignes :</b></p><ul class="cons">${li(D.c2)}</ul>
 </div>

 <div class="card obj">
 <h3><span class="badge">OBJ 3</span>Communication & concentration</h3>
 <div class="cible">🎯 Cible : moyenne ≥ 4/5</div>
 <table>
 <tr><th>Critère (note /5)</th><th>MT1</th><th>MT2</th></tr>
 ${D.k3.map((k,i)=>`<tr><td>${k}</td><td><div class="rate" data-r="c${i+1}a"></div></td><td><div class="rate" data-r="c${i+1}b"></div></td></tr>`).join("")}
 </table>
 <div class="res" id="r3">—</div>
 <p class="hint" style="margin-top:10px"><b>Consignes :</b></p><ul class="cons">${li(D.c3)}</ul>
 </div>

 <h2>3. Bilan du match</h2>
 <div class="card">
 <div class="score" id="sc">0 / 3</div>
 <p class="hint" style="text-align:center">objectifs atteints</p>
 <label>Mon ressenti (1 phrase)</label><textarea data-m="ressenti"></textarea>
 <label style="margin-top:8px">Ce que je garde</label><textarea data-m="garde"></textarea>
 <label style="margin-top:8px">Ce que j'ajuste au prochain match</label><textarea data-m="ajuste"></textarea>
 </div>

 <div class="btns">
 <button class="btn b2 full" onclick="envoyer()">✉️ Envoyer à Mr Din</button>
 <button class="btn b1" onclick="nouveau()">➕ Nouveau match</button>
 <button class="btn b3" onclick="window.print()">📄 Export PDF</button>
 <button class="btn b3" onclick="effacer()">↺ Effacer ce match</button>
 ${BENEF?"":`<button class="btn b3" onclick="exemple()">🧪 Exemple simulé</button>`}
 </div>

 <h2>4. Mon historique</h2>
 <div class="card" id="hist"></div>`;

 app.querySelectorAll("[data-f]").forEach(el=>{const k=el.dataset.f;el.value=S.f[k]??"";el.oninput=()=>{S.f[k]=el.value;save();calc()}});
 app.querySelectorAll("[data-m]").forEach(el=>{const k=el.dataset.m;el.value=S.m[k]??"";el.oninput=()=>{S.m[k]=el.value;save()}});
 app.querySelectorAll(".star").forEach(b=>b.onclick=()=>{const q=b.dataset.q,i=S.q.indexOf(q);
  if(i>-1)S.q.splice(i,1);else{if(S.q.length>=3){alert("Maximum 3 qualités fortes.");return}S.q.push(q)}save();draw()});
 app.querySelectorAll(".cnt").forEach(d=>{const k=d.dataset.c;d.innerHTML="<button>−</button><span></span><button>+</button>";
  d.children[0].onclick=()=>{S.c[k]=Math.max(0,(S.c[k]||0)-1);save();draw()};
  d.children[2].onclick=()=>{S.c[k]=(S.c[k]||0)+1;save();draw()}});
 app.querySelectorAll(".rate").forEach(d=>{const k=d.dataset.r;for(let i=1;i<=5;i++){const b=document.createElement("button");b.textContent=i;
  b.onclick=()=>{S.r[k]=S.r[k]===i?0:i;save();draw()};d.appendChild(b)}});
 save();draw();
}

const v=k=>S.c[k]||0;
const pct=(g,p)=>g+p?Math.round(g*100/(g+p)):null;
const cls=(x,t)=>x>=t?"ok":x>=t*.85?"mid":"ko";
const tgt=i=>+S.f["t"+i]||D.a2[i-1][1];
const moy3=()=>{const n=Object.values(S.r).filter(x=>x>0);return n.length?n.reduce((s,x)=>s+x,0)/n.length:null};
const duelsTot=()=>pct(v("d1g")+v("d2g"),v("d1p")+v("d2p"));

function calc(){
 const a=pct(v("d1g"),v("d1p")),b=pct(v("d2g"),v("d2p")),t=duelsTot();
 [["p1",a],["p2",b]].forEach(([id,x])=>{const e=document.getElementById(id);e.textContent=x===null?"—":x+" %";e.className=x===null?"":cls(x,70)});
 const r1=document.getElementById("r1"),G=v("d1g")+v("d2g"),T=G+v("d1p")+v("d2p");
 if(t===null){r1.textContent="Total : —";r1.className="res";ok[0]=false}
 else{ok[0]=t>=80;r1.textContent=`Total : ${t} % (${G}/${T}) — ${ok[0]?"✅ Objectif atteint":"❌ Objectif non atteint"}`;r1.className="res "+cls(t,80)}
 const re=[1,2,3].map(i=>v("o"+i+"a")+v("o"+i+"b")),n=re.filter((x,i)=>x>=tgt(i+1)).length,r2=document.getElementById("r2");
 if(re.every(x=>x===0)){r2.textContent="—";r2.className="res";ok[1]=false}
 else{ok[1]=n>=2;r2.textContent=`${n}/3 cibles atteintes — ${ok[1]?"✅ Objectif atteint":"❌ Objectif non atteint"}`;r2.className="res "+(ok[1]?"ok":n==1?"mid":"ko")}
 const m=moy3(),r3=document.getElementById("r3");
 if(m===null){r3.textContent="—";r3.className="res";ok[2]=false}
 else{ok[2]=m>=4;r3.textContent=`Moyenne : ${m.toFixed(1)}/5 — ${ok[2]?"✅ Objectif atteint":"❌ Objectif non atteint"}`;r3.className="res "+cls(m,4)}
 document.getElementById("sc").textContent=ok.filter(Boolean).length+" / 3";
}
function draw(){
 app.querySelectorAll(".star").forEach(b=>b.classList.toggle("on",S.q.includes(b.dataset.q)));
 app.querySelectorAll(".cnt").forEach(d=>d.children[1].textContent=v(d.dataset.c));
 app.querySelectorAll(".rate").forEach(d=>[...d.children].forEach((b,i)=>b.classList.toggle("on",S.r[d.dataset.r]===i+1)));
 document.getElementById("chips").innerHTML=S.q.length?S.q.map(q=>`<span class="chip">★ ${esc(q)}</span>`).join(""):'<span class="hint">Aucune qualité sélectionnée</span>';
 document.getElementById("mnum").textContent="Match n°"+(S.hist.length+1);
 calc();hist();
}
function hist(){
 const h=S.hist,el=document.getElementById("hist");
 if(!h.length){el.innerHTML='<p class="hint">Aucun match archivé. Après chaque match : <b>Envoyer à Mr Din</b>, puis <b>Nouveau match</b>.</p>';return}
 const dv=h.filter(x=>x.duels!==null).map(x=>x.duels),avg=dv.length?Math.round(dv.reduce((s,x)=>s+x,0)/dv.length):null;
 const sc=h.reduce((s,x)=>s+x.score,0);
 el.innerHTML=`
 <div class="grid2" style="text-align:center;margin-bottom:8px">
 <div><div class="score" style="font-size:22px">${h.length}</div><p class="hint">matchs</p></div>
 <div><div class="score ${avg===null?"":cls(avg,80)}" style="font-size:22px">${avg===null?"—":avg+" %"}</div><p class="hint">duels gagnés (moyenne)</p></div>
 </div>
 <p class="hint">Duels gagnés par match (ligne 80 % = objectif)</p>
 <div class="hbar" style="background:linear-gradient(to top,transparent 79%,rgba(212,175,55,.5) 79.5%,transparent 80.5%)">
 ${h.map((x,i)=>`<div class="hcol"><b style="font-size:10px" class="${x.duels===null?"":cls(x.duels,80)}">${x.duels===null?"—":x.duels}</b><div style="height:${(x.duels||0)*.8}px;background:${x.duels===null?"var(--line)":x.duels>=80?"var(--ok)":x.duels>=68?"var(--mid)":"var(--ko)"}"></div><span>M${i+1}</span></div>`).join("")}
 </div>
 <table style="margin-top:8px">
 <tr><th>#</th><th>Match</th><th>Duels</th><th>Score</th><th></th></tr>
 ${h.map((x,i)=>`<tr><td>M${i+1}</td><td style="text-align:left">${esc(x.match||"—")}<br><small class="hint">${esc(x.date||"")}</small></td><td>${x.duels===null?"—":x.duels+" %"}</td><td><b>${x.score}/3</b></td><td class="noprint"><button class="back" style="margin:0;padding:3px 8px" onclick="suppr(${i})">✕</button></td></tr>`).join("")}
 </table>
 <p class="hint">Total : ${sc} objectifs atteints sur ${h.length*3}.</p>`;
}
function suppr(i){if(confirm("Supprimer le match M"+(i+1)+" de l'historique ?")){S.hist.splice(i,1);save();draw()}}
function resume(){
 return{date:S.m.date||"",match:S.m.match||"",duels:duelsTot(),ok:[...ok],score:ok.filter(Boolean).length,
  o2:[1,2,3].map(i=>v("o"+i+"a")+v("o"+i+"b")),m3:moy3()};
}
function nouveau(){
 const vide_=!Object.values(S.c).some(x=>x)&&!Object.values(S.r).some(x=>x);
 if(vide_){alert("Remplis d'abord ce match (duels, actions, notes).");return}
 if(!S.sent&&!confirm("Tu n'as pas encore envoyé ce match à Mr Din. Archiver quand même ?"))return;
 if(S.sent&&!confirm("Archiver ce match et préparer le prochain ?"))return;
 S.hist.push(resume());S.c={};S.r={};S.m={};S.sent=false;save();
 app.querySelectorAll("[data-m]").forEach(el=>el.value="");
 draw();window.scrollTo({top:0,behavior:"smooth"});
 alert("Match archivé ✅ Prêt pour le match n°"+(S.hist.length+1)+".");
}
function effacer(){if(!confirm("Effacer les données de ce match (l'historique est conservé) ?"))return;S.c={};S.r={};S.m={};S.sent=false;save();app.querySelectorAll("[data-m]").forEach(el=>el.value="");draw()}
function exemple(){
 if(!confirm("Remplir avec un exemple de match simulé ?"))return;
 S.q=[D.blocs[0][1][0][0],D.blocs[1][1][0][0],"Concentration"];
 S.c={d1g:7,d1p:1,d2g:6,d2p:2};
 [1,2,3].forEach(i=>{const t=tgt(i),x=i<3?t:Math.max(0,t-1);S.c["o"+i+"a"]=Math.ceil(x/2);S.c["o"+i+"b"]=Math.floor(x/2)});
 S.r={c1a:4,c1b:3,c2a:5,c2b:4,c3a:4,c3b:4,c4a:3,c4b:5};
 S.m={match:"Match simulé",date:new Date().toISOString().slice(0,10),ressenti:"Solide dans mes duels, je me suis libéré en 2e mi-temps.",garde:"Mes duels et mes qualités fortes.",ajuste:"Parler plus en 2e mi-temps."};
 app.querySelectorAll("[data-m]").forEach(el=>el.value=S.m[el.dataset.m]??"");
 save();draw();
}
function envoyer(){
 const f=S.f,m=S.m,t=duelsTot(),m3=moy3(),n=S.hist.length+1;
 const dv=S.hist.filter(x=>x.duels!==null).map(x=>x.duels).concat(t===null?[]:[t]);
 const avg=dv.length?Math.round(dv.reduce((s,x)=>s+x,0)/dv.length):null;
 const body=`FICHE ${D.nom.toUpperCase()} — Y.E.S.I CONCEPT
Joueur : ${f.joueur||""} | ${f.club||""}
Match n°${n} : ${m.match||""} | ${m.date||""}

Qualités fortes : ${S.q.join(", ")||"—"}
Objectif final : ${f.final||""}

OBJ 1 — Duels : ${t===null?"—":t+" %"} (MT1 ${v("d1g")}/${v("d1g")+v("d1p")} – MT2 ${v("d2g")}/${v("d2g")+v("d2p")}) ${ok[0]?"✅":"❌"}
OBJ 2 — ${D.a2.map((a,i)=>`${a[0]} ${v("o"+(i+1)+"a")+v("o"+(i+1)+"b")}/${tgt(i+1)}`).join(" · ")} ${ok[1]?"✅":"❌"}
OBJ 3 — Communication/concentration : ${m3===null?"—":m3.toFixed(1)}/5 ${ok[2]?"✅":"❌"}

SCORE DU MATCH : ${ok.filter(Boolean).length}/3

Ressenti : ${m.ressenti||""}
Je garde : ${m.garde||""}
J'ajuste : ${m.ajuste||""}

— Suivi : ${n} match(s), duels gagnés en moyenne : ${avg===null?"—":avg+" %"}`;
 S.sent=true;save();
 location.href="mailto:yesiconcept.rdv@gmail.com?subject="+encodeURIComponent(`Fiche ${D.nom} — ${f.joueur||""} — Match n°${n} ${m.match||""}`)+"&body="+encodeURIComponent(body);
 setTimeout(()=>{if(confirm("Fiche envoyée ? Archiver ce match et préparer le prochain ?")){S.hist.push(resume());S.c={};S.r={};S.m={};S.sent=false;save();app.querySelectorAll("[data-m]").forEach(el=>el.value="");draw();window.scrollTo({top:0})}},1500);
}
if(ID&&P[ID])fiche(ID);else accueil();
</script>
</body>
</html>
